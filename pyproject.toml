[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tt"
version = "0.1.0"
description = "Personal terminal-first retrospective time tracker"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tt = "tt.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/tt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
